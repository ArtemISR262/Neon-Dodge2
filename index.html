
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DODGE</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050816;
    color: #eafaff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
  }

  .game {
    width: min(94vw, 420px);
    text-align: center;
    padding: 20px 0;
  }

  h1 {
    margin: 0 0 8px;
    color: #00f7ff;
    font-size: clamp(28px, 8vw, 40px);
    letter-spacing: 5px;
    text-shadow: 0 0 12px #00f7ff, 0 0 30px #0077ff;
  }

  .subtitle {
    color: #8496bb;
    font-size: 13px;
    margin-bottom: 18px;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .stat {
    flex: 1;
    padding: 12px 6px;
    border: 1px solid #173a59;
    border-radius: 10px;
    background: #0a1225;
  }

  .stat span {
    display: block;
    color: #7e94b7;
    font-size: 11px;
    margin-bottom: 5px;
    letter-spacing: 1px;
  }

  .stat strong {
    font-size: 22px;
    color: #00f7ff;
    text-shadow: 0 0 10px #00f7ff66;
  }

  .arena {
    position: relative;
    border: 1px solid #00b9df;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 12px #00d9ff33, inset 0 0 25px #004cff15;
    background: #070d20;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 24px;
    background: #050816c9;
    backdrop-filter: blur(4px);
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    color: #00f7ff;
    font-size: 28px;
    text-shadow: 0 0 15px #00f7ff88;
    margin: 0 0 12px;
  }

  .overlay p {
    color: #b2c5e8;
    line-height: 1.7;
    font-size: 14px;
    margin: 0 0 20px;
  }

  button {
    border: 1px solid #00f7ff;
    background: #062333;
    color: #00f7ff;
    padding: 13px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
  }

  button:hover {
    background: #00f7ff;
    color: #050816;
    box-shadow: 0 0 20px #00f7ff88;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-top: 14px;
  }

  .controls button {
    flex: 1;
    font-size: 25px;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  .hint {
    margin-top: 13px;
    color: #7185a8;
    font-size: 12px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="game">
  <h1>NEON DODGE</h1>
  <div class="subtitle">УКЛОНЯЙСЯ. ВЫЖИВАЙ. ПОБЕЖДАЙ.</div>

  <div class="stats">
    <div class="stat">
      <span>СЧЁТ</span>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <span>РЕКОРД</span>
      <strong id="best">0</strong>
    </div>
    <div class="stat">
      <span>УРОВЕНЬ</span>
      <strong id="level">1</strong>
    </div>
  </div>

  <div class="arena">
    <canvas id="canvas" width="400" height="600"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="message">READY?</h2>
      <p id="description">
        Уворачивайся от красных блоков.<br>
        Собирай очки и не попадайся!<br><br>
        ← → или A / D для движения
      </p>
      <button id="startBtn">▶ НАЧАТЬ ИГРУ</button>
    </div>
  </div>

  <div class="controls">
    <button id="leftBtn" aria-label="Влево">◀</button>
    <button id="rightBtn" aria-label="Вправо">▶</button>
  </div>

  <div class="hint">
    Управление: ← → / A D или кнопки снизу.<br>
    На телефоне также можно двигать корабль пальцем.
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const levelEl = document.getElementById("level");
  const overlay = document.getElementById("overlay");
  const message = document.getElementById("message");
  const description = document.getElementById("description");
  const startBtn = document.getElementById("startBtn");

  const W = canvas.width;
  const H = canvas.height;

  let best = 0;
  try {
    best = Number(localStorage.getItem("neonDodgeBest")) || 0;
  } catch (_) {}

  bestEl.textContent = best;

  let player;
  let obstacles = [];
  let particles = [];
  let stars = [];
  let score = 0;
  let level = 1;
  let running = false;
  let lastTime = 0;
  let spawnTimer = 0;
  let animationId = 0;
  let keys = {};
  let pointerTarget = null;
  let elapsed = 0;
  let recordMessageTimer = 0;
  let previousBest = best;

  for (let i = 0; i < 65; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + 0.4,
      speed: Math.random() * 65 + 20,
      alpha: Math.random() * 0.7 + 0.2
    });
  }

  function reset() {
    player = { x: W / 2, y: H - 75, w: 26, h: 34, speed: 300 };
    obstacles = [];
    particles = [];
    score = 0;
    level = 1;
    elapsed = 0;
    spawnTimer = 0;
    keys = {};
    pointerTarget = null;
    scoreEl.textContent = "0";
    levelEl.textContent = "1";
  }

  function startGame() {
    cancelAnimationFrame(animationId);
    reset();
    running = true;
    overlay.classList.add("hidden");
    lastTime = performance.now();
    animationId = requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try {
        localStorage.setItem("neonDodgeBest", String(best));
      } catch (_) {}
    }

    message.textContent = "GAME OVER";
    description.innerHTML =
      "Твой счёт: <b style='color:#00f7ff'>" + score +
      "</b><br>Уровень: " + level +
      "<br><br>Попробуй побить свой рекорд!";
    startBtn.textContent = "↻ ИГРАТЬ СНОВА";
    overlay.classList.remove("hidden");
  }

  function addExplosion(x, y, color, amount = 12) {
    for (let i = 0; i < amount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 180 + 40;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: Math.random() * 0.45 + 0.25,
        maxLife: 0.7,
        size: Math.random() * 4 + 1,
        color
      });
    }
  }

  function spawnObstacle() {
    const size = Math.random() * 22 + 22;
    const x = Math.random() * (W - size);

    obstacles.push({
      x,
      y: -size,
      w: size,
      h: size,
      speed: 160 + level * 22 + Math.random() * 75,
      color: Math.random() < 0.22 ? "#ff3df2" : "#ff3158",
      passed: false
    });
  }

  function drawBackground(dt) {
    ctx.fillStyle = "#070d20";
    ctx.fillRect(0, 0, W, H);

    // Неоновая сетка
    ctx.strokeStyle = "#143052";
    ctx.lineWidth = 1;
    const grid = 40;
    const offset = (elapsed * 35) % grid;

    for (let x = 0; x <= W; x += grid) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }

    for (let y = -grid + offset; y < H; y += grid) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // Звёзды
    for (const s of stars) {
      s.y += s.speed * dt;
      if (s.y > H) {
        s.y = 0;
        s.x = Math.random() * W;
      }

      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = "#b5faff";
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    const p = player;
    ctx.save();
    ctx.translate(p.x, p.y);

    // Двигатель
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#00f7ff";
    ctx.fillStyle = "#00f7ff";
    ctx.beginPath();
    ctx.moveTo(-7, 12);
    ctx.lineTo(0, 24 + Math.random() * 6);
    ctx.lineTo(7, 12);
    ctx.closePath();
    ctx.fill();

    // Корпус корабля
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00f7ff";
    ctx.fillStyle = "#00f7ff";
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(17, 14);
    ctx.lineTo(0, 8);
    ctx.lineTo(-17, 14);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#eaffff";
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(5, 5);
    ctx.lineTo(-5, 5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawObstacle(o) {
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = o.color;
    ctx.fillStyle = o.color;
    ctx.fillRect(o.x, o.y, o.w, o.h);

    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#ffffffaa";
    ctx.lineWidth = 1;
    ctx.strokeRect(o.x + 4, o.y + 4, o.w - 8, o.h - 8);
    ctx.restore();
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life -= dt;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function intersects(a, b) {
    // Немного уменьшаем хитбокс для честной игры
    return (
      a.x - a.w * 0.35 < b.x + b.w - 3 &&
      a.x + a.w * 0.35 > b.x + 3 &&
      a.y - a.h * 0.3 < b.y + b.h - 3 &&
      a.y + a.h * 0.4 > b.y + 3
    );
  }

  function update(dt) {
    elapsed += dt;
    level = 1 + Math.floor(score / 150);
    levelEl.textContent = level;

    // Движение корабля
    let direction = 0;
    if (keys.ArrowLeft || keys.a || keys.A) direction -= 1;
    if (keys.ArrowRight || keys.d || keys.D) direction += 1;

    if (pointerTarget !== null) {
      const diff = pointerTarget - player.x;
      player.x += Math.sign(diff) *
        Math.min(Math.abs(diff), player.speed * dt);
    } else {
      player.x += direction * player.speed * dt;
    }

    player.x = Math.max(20, Math.min(W - 20, player.x));

    // Создание препятствий
    spawnTimer -= dt;
    const spawnInterval = Math.max(0.23, 0.82 - level * 0.045);

    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = spawnInterval;
    }

    // Движение препятствий и проверка столкновений
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += o.speed * dt;

      if (intersects(player, o)) {
        addExplosion(player.x, player.y, "#00f7ff", 30);
        addExplosion(o.x + o.w / 2, o.y + o.h / 2, o.color, 20);
        drawBackground(0);
        obstacles.forEach(drawObstacle);
        drawParticles(0);
        endGame();
        return;
      }

	if (!o.passed && o.y > player.y + 20) {
	  o.passed = true;
	  score += 10;
	  scoreEl.textContent = score;

	  // Проверяем, побит ли рекорд
	  if (score > best) {
	    best = score;
	    bestEl.textContent = best;
	
	    try {
	      localStorage.setItem("neonDodgeBest", String(best));
	    } catch (_) {}
	
	    // Показываем сообщение о новом рекорде
	    recordMessageTimer = 2.5;
	  }
	}

      if (o.y > H + 50) {
        obstacles.splice(i, 1);
      }
    }

    // Частицы продолжают затухать
    drawParticles(dt);
  }

  function render(dt) {
    drawBackground(dt);
    obstacles.forEach(drawObstacle);
    drawPlayer();
    drawParticles(dt);

    // Надпись о новом рекорде
    if (recordMessageTimer > 0) {
      recordMessageTimer -= dt;

      const alpha = Math.min(
        1,
        recordMessageTimer,
        (2.5 - recordMessageTimer) * 4
      );

      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 25px Arial";
      ctx.fillStyle = "#ffe66d";
      ctx.shadowColor = "#ffb700";
      ctx.shadowBlur = 25;

      ctx.fillText("★ НОВЫЙ РЕКОРД! ★", W / 2, 100);

      ctx.restore();
    }
  }

  function loop(now) {
    if (!running) return;

    const dt = Math.min((now - lastTime) / 1000, 0.035);
    lastTime = now;

    update(dt);

    if (running) {
      render(dt);
      animationId = requestAnimationFrame(loop);
    }
  }

  // Клавиатура
  window.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
      e.preventDefault();
    }
    keys[e.key] = true;

    if (!running && (e.key === "Enter" || e.key === " ")) {
      startGame();
    }
  });

  window.addEventListener("keyup", e => {
    keys[e.key] = false;
  });

  window.addEventListener("blur", () => {
    keys = {};
    pointerTarget = null;
  });

  // Кнопки для мобильных устройств
  function bindButton(id, key) {
    const btn = document.getElementById(id);

    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      keys[key] = true;
      btn.setPointerCapture(e.pointerId);
    });

    const release = e => {
      e.preventDefault();
      keys[key] = false;
    };

    btn.addEventListener("pointerup", release);
    btn.addEventListener("pointercancel", release);
    btn.addEventListener("lostpointercapture", () => {
      keys[key] = false;
    });
  }

  bindButton("leftBtn", "ArrowLeft");
  bindButton("rightBtn", "ArrowRight");

  // Управление пальцем прямо на игровом поле
  function moveToPointer(e) {
    const rect = canvas.getBoundingClientRect();
    pointerTarget = (e.clientX - rect.left) * W / rect.width;
  }

  canvas.addEventListener("pointerdown", e => {
    if (!running) return;
    moveToPointer(e);
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", e => {
    if (running && e.buttons) moveToPointer(e);
  });

  canvas.addEventListener("pointerup", () => {
    pointerTarget = null;
  });

  canvas.addEventListener("pointercancel", () => {
    pointerTarget = null;
  });

  startBtn.addEventListener("click", startGame);

  // Красивый экран до начала игры
  reset();
  drawBackground(0);
  drawPlayer();
})();
</script>
</body>
</html>
